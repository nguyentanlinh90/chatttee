apply plugin: 'com.android.application'
apply plugin: 'realm-android'
apply plugin: 'io.fabric'
apply plugin: 'io.michaelrocks.paranoid'
apply plugin: 'AndResGuard'

// Create a variable called keystorePropertiesFile, and initialize it to your
// keystore.properties file, in the rootProject folder.
def keystorePropertiesFile = rootProject.file("keystore.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    signingConfigs {
        config {

        }
    }
    compileSdkVersion 28
    buildToolsVersion '27.0.3'
    defaultConfig {
        applicationId "com.teecoin"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            debuggable false
//            testCoverageEnabled false
            manifestPlaceholders = [enableCrashReporting:"true"]
        }
        debug{
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
            manifestPlaceholders = [enableCrashReporting:"false"]
        }
    }
    flavorDimensions "teecoin"
    productFlavors {
        WalletUserApp {
            applicationId "com.teecoin.TeecoinWalletForUser"
            dimension "teecoin"
            resValue "string", "flavored_app_name", "TEE-Wallet"
            resValue "string", "file_provider_authority", applicationId + ".fileprovider"
            buildConfigField 'boolean', 'IS_APP_USER', 'true'
            buildConfigField 'boolean', 'IS_CHATEE_APP', 'false'
            versionCode 14
            versionName "1.0.9"
        }
        WalletShopApp {
            applicationId "com.teecoin.TeecoinWalletForShop"
            dimension "teecoin"
            resValue "string", "flavored_app_name", "TEE-Shop"
            resValue "string", "file_provider_authority", applicationId + ".fileprovider"
            buildConfigField 'boolean', 'IS_APP_USER', 'false'
            buildConfigField 'boolean', 'IS_CHATEE_APP', 'false'
            versionCode 14
            versionName "1.0.9"
        }
        ChateeUserApp {
            applicationId "com.teecoin.ChatteeForUser"
            dimension "teecoin"
            resValue "string", "flavored_app_name", "ChatTee"
            resValue "string", "file_provider_authority", applicationId + ".fileprovider"
            buildConfigField 'boolean', 'IS_APP_USER', 'true'
            buildConfigField 'boolean', 'IS_CHATEE_APP', 'true'
            versionCode 49
            versionName "1.0.46"
        }
        ChateeShopApp {
            applicationId "com.teecoin.ChatteeForShop"
            dimension "teecoin"
            resValue "string", "flavored_app_name", "ChatTee Shop"
            resValue "string", "file_provider_authority", applicationId + ".fileprovider"
            buildConfigField 'boolean', 'IS_APP_USER', 'false'
            buildConfigField 'boolean', 'IS_CHATEE_APP', 'true'
            versionCode 10
            versionName "1.0.8"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0-rc01'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    /* MULTIDEX APPLICATION */
    implementation 'com.android.support:multidex:1.0.1'

    /* BUTTER KNIFE */
    implementation 'com.jakewharton:butterknife:8.8.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'

    /* RECYCLER VIEW */
//    implementation 'com.android.support:recyclerview-v7:27.1.1'
    implementation 'com.android.support:recyclerview-v7:28.0.0-rc01'

    /* ZXING QR CODE */
    implementation('com.journeyapps:zxing-android-embedded:3.5.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.2'

    /* RETROFIT */
    implementation ('com.squareup.retrofit2:retrofit:2.4.0')
    implementation ('com.squareup.retrofit2:adapter-rxjava:2.1.0')
    implementation ('com.squareup.retrofit2:converter-gson:2.1.0')
    implementation ('com.squareup.okhttp3:logging-interceptor:3.8.0')

    /* GOOGLE GSON */
    implementation ('com.google.code.gson:gson:2.8.4')

    /* RX ANDROID */
    implementation ('io.reactivex:rxandroid:1.2.1')
    implementation ('io.reactivex:rxjava:1.1.8')

    /* TEECOIN LIBRARY */
    implementation (project(path: ':javastellarsdk')){
        exclude group: 'javax.inject',module: 'javax.inject'
    }

    /* FACEBOOK STETHO */
    implementation 'com.facebook.stetho:stetho:1.5.0'
    implementation 'com.uphyca:stetho_realm:2.1.0'

    /* FACEBOOK SDK */
    implementation 'com.facebook.android:facebook-android-sdk:[5,6)'
    //implementation 'com.facebook.android:facebook-android-sdk:4+'

    /* GLIDE */
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    /* MATERIAL RATING BAR */
    implementation 'me.zhanghai.android.materialratingbar:library:1.3.1'

    /* CIRCLE INDICATOR PAGER */
    implementation 'com.bikomobile:circleindicatorpager:1.0.0'
    implementation "ru.tinkoff.scrollingpagerindicator:scrollingpagerindicator:1.0.6"

    /* GOOGLE PLAY SERVICES */
    implementation 'com.google.android.gms:play-services-maps:15.0.1'
    implementation 'com.google.android.gms:play-services-location:15.0.1'
    implementation 'com.google.android.gms:play-services-places:15.0.1'

    /* SLIDE PANEL */
    implementation 'com.sothree.slidinguppanel:library:3.4.0'

    /* FLOW LAYOUT */
    implementation 'com.nex3z:flow-layout:1.2.2'

    /* SEEK BAR */
    implementation 'org.adw.library:discrete-seekbar:1.0.1'

    /* GOOGLE FIRE BASE */
    implementation 'com.google.firebase:firebase-core:16.0.1'
    implementation 'com.google.firebase:firebase-firestore:17.1.5'

    /* GOOGLE FIRE BASE NOTIFICATION */
    implementation 'com.google.firebase:firebase-messaging:17.3.4'

    /* GOOGLE FIRE BASE DYNAMIC LINK */
    implementation 'com.google.firebase:firebase-dynamic-links:16.1.7'

    /* CRASH LYTICS */
    implementation 'com.crashlytics.sdk.android:crashlytics:2.9.5'

    /* CAMERA VIEW */
    implementation 'com.otaliastudios:cameraview:1.6.0'

    /* TIME AGO */
   // implementation 'com.github.marlonlom:timeago:3.0.2'

    /* FFmpeg  */
    implementation 'com.writingminds:FFmpegAndroid:0.3.2'

    /* Android Size */
    implementation 'com.github.sokolyaka:androidsizes:1.0.2'

    /* Sticky Scroll View */
    implementation 'se.emilsjolander:StickyScrollViewItems:1.1.0'

    /* AppsFlyer */
    implementation 'com.appsflyer:af-android-sdk:4.8.9'
    implementation 'com.android.installreferrer:installreferrer:1.+'

    /* Chart Lib*/
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0-alpha'

    /* Phone number Lib */
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.10.2'

    /* Login with google */
    implementation 'com.google.android.gms:play-services-auth:16.0.1'

}

apply plugin: 'com.google.gms.google-services'




andResGuard {
    // mappingFile = file("./resource_mapping.txt")
    mappingFile = null
    use7zip = false
    useSign = false
    // It will keep the origin path of your resources when it's true
    keepRoot = false
    // If set, name column in arsc those need to proguard will be kept to this value
    fixedResName = "arg"
    // It will merge the duplicated resources, but don't rely on this feature too much.
    // it's always better to remove duplicated resource from repo
    mergeDuplicatedRes = true
    whiteList = [
            // your icon
            "R.drawable.icon",
            // for fabric
            "R.string.com.crashlytics.*",
            // for google-services
            "R.string.google_app_id",
            "R.string.gcm_defaultSenderId",
            "R.string.default_web_client_id",
            "R.string.ga_trackingId",
            "R.string.firebase_database_url",
            "R.string.google_api_key",
            "R.string.google_crash_reporting_api_key",
            "R.string.google_maps_key",
            "R.string.Teecoin_notification_channel_id",
            "R.string.facebook_app_id",
            "R.string.google_client_id",
            "R.string.font_awesome_regular",
            "R.string.font_awesome_solid",
            "R.drawable.ic_convenience_*"

    ]
    compressFilePattern = [
            "*.png",
            "*.jpg",
            "*.jpeg",
            "*.gif",
    ]
    sevenzip {
        //artifact = 'com.tencent.mm:SevenZip:1.2.17'
        //path = "/usr/local/bin/7za"
    }

    /**
     * Optional: if finalApkBackupPath is null, AndResGuard will overwrite final apk
     * to the path which assemble[Task] write to
     **/
    // finalApkBackupPath = "${project.rootDir}/final.apk"

    /**
     * Optional: Specifies the name of the message digest algorithm to user when digesting the entries of JAR file
     * Only works in V1signing, default value is "SHA-1"
     **/
    // digestalg = "SHA-256"
}