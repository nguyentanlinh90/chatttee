apply plugin: 'com.android.library'
apply plugin: 'io.michaelrocks.paranoid'

android {
    compileSdkVersion 27


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        debug{
            buildConfigField "int", "TRIAM_MODE", "1" //1: DEV mode, 2: Production mode
        }
        release {
            buildConfigField "int", "TRIAM_MODE", "2" //1: DEV mode, 2: Production mode
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:27.1.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.squareup.okhttp3:okhttp:3.9.1'
    implementation 'com.moandjiezana.toml:toml4j:0.5.1'
    implementation 'org.mockito:mockito-core:2.13.0'
    implementation 'com.google.guava:guava:18.0'
    implementation 'com.google.code.gson:gson:2.8.4'
    implementation 'commons-io:commons-io:2.4'
    implementation 'org.glassfish.jersey.core:jersey-client:2.22.1'
    implementation 'org.glassfish.jersey.media:jersey-media-sse:2.22.1'
    implementation 'javax.activation:activation:1.1.1'
}
